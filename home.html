<!DOCTYPE html>
<html lang="en">
<head>
<title>Dawn's Web Radio Station</title>
<script type="text/javascript">
window.onload = function () {
    var conn;
    var error = document.getElementById("error");
    if (window["WebSocket"]) {
        console.log("ws://" + document.location.host + "/ws");
        conn = new WebSocket("ws://" + document.location.host + "/ws"); //the websocket path
        conn.binaryType = "arraybuffer";
        conn.onclose = function (evt) {
            var item = document.createElement("div");
            item.innerHTML = "<b>Connection closed.</b>";
            error.appendChild(item);
        };
        conn.onmessage = function (evt) {
          if(evt.data instanceof ArrayBuffer){
            const blob = new Blob([evt.data], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.play();

            audio.onended = () => {
              URL.revokeObjectURL(url);
            };
          }
        };
    } else {
        var item = document.createElement("div");
        item.innerHTML = "<b>Your browser does not support WebSockets.</b>";
        error.appendChild(item);
    }
};
</script>
<style type="text/css">
body {
    padding: 0;
    margin: 0;
    width: 100%;
    height: 100%;
}

h1 {
  font-size: 3em;
  font-weight: bold;
  text-decoration:underline;
  text-align:center;
  color:white;
  text-shadow: 2px 2px 5px red;
  margin:10px;
}

#header {
    width: 100%;
    height: 15%;
    background-color: #343434;
    top:0px;
    position:fixed;
    margin:0 auto;
}

#footer {
  width: 100%;
  height: 15%;
  background-color:#343434;
  position:fixed;
  margin:0 auto;
  bottom:0px;
}
</style>

</head>
<body>
<div id="header">
  <h1>Dawn's Amazing Web Radio Station!</h1>
</div>
<div id="error"></div>
<div id="footer"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<title>Chat Example</title>
<script type="text/javascript">
window.onload = function () {
    var conn;
    var log = document.getElementById("counter");

    //if we have the ability to do websockets, 
    if (window["WebSocket"]) {
        console.log("ws://" + document.location.host + "/ws");
        conn = new WebSocket("ws://" + document.location.host + "/ws"); //the websocket path
        conn.binaryType = "arraybuffer";
        //on close create log saying we're closed
        conn.onclose = function (evt) {
            var item = document.createElement("div");
            item.innerHTML = "<b>Connection closed.</b>";
        };
        //on message, create the element and add that message
        conn.onmessage = function (evt) {
          console.log("received message");
          if(evt.data instanceof ArrayBuffer){
          //const view = new DataView(event.data);
          console.log(evt.data.byteLength);
          }
        };
    } else {
        //if the browser doesnt support it, report
        var item = document.createElement("div");
        item.innerHTML = "<b>Your browser does not support WebSockets.</b>";
    }
    console.log("Complete setup");
};
</script>
<style type="text/css">
html {
    overflow: hidden;
}

body {
    overflow: hidden;
    padding: 0;
    margin: 0;
    width: 100%;
    height: 100%;
    background: gray;
}

#log {
    background: white;
    margin: 0;
    padding: 0.5em 0.5em 0.5em 0.5em;
    position: absolute;
    top: 0.5em;
    left: 0.5em;
    right: 0.5em;
    bottom: 3em;
    overflow: auto;
}

#form {
    padding: 0 0.5em 0 0.5em;
    margin: 0;
    position: absolute;
    bottom: 1em;
    left: 0px;
    width: 100%;
    overflow: hidden;
}

</style>
</head>
<body>
<div id="counter"></div>
</body>
</html>
